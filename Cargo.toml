[package]
name = "babble_boop"
version = "0.5.0"
edition = "2021"

[dependencies]
cpal = "0.15.3"
eframe = { version = "0.29", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
hound = "3.5.1"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rosc = "0.10.1"
serde = { version = "1.0.205", features = ["derive"] }
serde_json = "1.0.122"
tokio = { version = "1.39.2", features = ["rt-multi-thread", "sync", "net", "time", "fs", "io-util", "macros"] }
toml = "0.8.19"

[lints.clippy]
# Slicing a str by byte range panics inside a multibyte character.
string_slice = "deny"
# A dropped Result hides a failure, such as a report that did not fit in a
# full channel. Handle the Result, or put an expect attribute with the
# reason on the line that drops it.
let_underscore_must_use = "deny"
unused_result_ok = "deny"

[dev-dependencies]
# Paused clock for timing tests (tokio::test(start_paused = true)).
tokio = { version = "1.39.2", features = ["test-util"] }
