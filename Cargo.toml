[package]
name = "babble_boop"
version = "0.4.0"
edition = "2021"

[dependencies]
cpal = "0.15.3"
eframe = { version = "0.29", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
hound = "3.5.1"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rosc = "0.10.1"
serde = { version = "1.0.205", features = ["derive"] }
tokio = { version = "1.39.2", features = ["rt-multi-thread", "sync", "net", "time", "fs", "io-util", "macros"] }
toml = "0.8.19"

[dev-dependencies]
serde_json = "1.0.122"
